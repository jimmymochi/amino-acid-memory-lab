<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 225" role="img" aria-labelledby="title desc">
<title id="title">Alanine — side chain</title>
<desc id="desc">Original vector drawing. Grey Cα marks the backbone attachment, not an extra side-chain carbon. Ring vertices are carbon atoms; hydrogens on skeletal carbons are implicit.</desc>
<path d="M110.00 162.96 L110.00 112.04" fill="none" stroke="#91a2aa" stroke-width="2.6" stroke-linecap="round"/>
<text x="110" y="180" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500" fill="#91a2aa">Cα</text>
<text x="110" y="95" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500" fill="#254d59">CH₃</text>
</svg>
