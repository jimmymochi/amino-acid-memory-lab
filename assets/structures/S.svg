<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 265" role="img" aria-labelledby="title desc">
<title id="title">Serine — side chain</title>
<desc id="desc">Original vector drawing. Grey Cα marks the backbone attachment, not an extra side-chain carbon. Ring vertices are carbon atoms; hydrogens on skeletal carbons are implicit.</desc>
<path d="M120.00 202.96 L120.00 162.04" fill="none" stroke="#91a2aa" stroke-width="2.6" stroke-linecap="round"/>
<path d="M120.00 127.96 L120.00 77.04" fill="none" stroke="#254d59" stroke-width="2.6" stroke-linecap="round"/>
<text x="120" y="220" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500" fill="#91a2aa">Cα</text>
<text x="120" y="145" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500" fill="#254d59">CH₂</text>
<text x="120" y="60" text-anchor="middle" dominant-baseline="central" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="500" fill="#be5968">OH</text>
</svg>
